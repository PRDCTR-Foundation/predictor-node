name: publish

on:
  workflow_run:
    workflows:
      - cargo-build
    types:
      - completed

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find release tag
        id: release
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$(git tag --points-at "$HEAD_SHA" | sort -V | tail -n 1)"

          if [[ -z "$TAG_NAME" ]]; then
            echo "No tag found for cargo-build commit $HEAD_SHA; skipping publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' >/tmp/is-draft; then
            echo "No published release found for tag $TAG_NAME; skipping publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(cat /tmp/is-draft)" == "true" ]]; then
            echo "Release $TAG_NAME is still a draft; skipping publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            dist/predictor-node
            dist/predictor-node.sha256
            dist/predictor_runtime.compact.compressed.wasm
            dist/predictor_runtime.compact.compressed.wasm.sha256

      - name: Docker login
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: dist/
          file: ./Containerfile
          push: true
          tags: ghcr.io/prdctr-foundation/predictor-node:${{ steps.release.outputs.tag_name }}
          cache-from: type=gha,scope=predictor-node-docker
          cache-to: type=gha,mode=max,scope=predictor-node-docker
