name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to target for release PR
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event.inputs.target_branch || github.ref_name }}

      - id: release-pr
        name: Resolve release PR branch
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.RELEASE_PR);
            const branch = pr.headBranchName || pr.headRefName || pr.head?.ref;
            if (!branch) {
              core.setFailed(`Could not find release PR branch in: ${process.env.RELEASE_PR}`);
              return;
            }
            core.setOutput('branch', branch);

      - name: Checkout release PR
        if: ${{ steps.release-pr.outputs.branch != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.branch }}

      - name: Update Cargo.lock
        if: ${{ steps.release-pr.outputs.branch != '' }}
        run: cargo update --workspace --offline

      - name: Commit Cargo.lock
        if: ${{ steps.release-pr.outputs.branch != '' }}
        run: |
          if git diff --quiet Cargo.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for release"
          git push
