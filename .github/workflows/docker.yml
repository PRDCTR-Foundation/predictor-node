name: docker

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: prdctr.io/predictor-node

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Find matching cargo-build run
        id: build-run
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'cargo-build.yml';
            const head_sha = '${{ github.event.release ? github.event.release.target_commitish : github.sha }}';
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const match = runs.find((r) => r.head_sha === head_sha && r.conclusion === 'success');
            if (!match) {
              core.setFailed(`No successful cargo-build run found for commit ${head_sha}`);
              return;
            }
            core.setOutput('run_id', String(match.id));

      - name: Download release artifacts from cargo-build run
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          run-id: ${{ steps.build-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${{ env.IMAGE }}:${SHORT_SHA}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="$TAGS,${{ env.IMAGE }}:${{ github.event.release.tag_name }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO enable pushing to Docker Hub once we're ready to publish images
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=predictor-node-docker
          cache-to: type=gha,mode=max,scope=predictor-node-docker
