name: cargo-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SKIP_WASM_BUILD: 1
  # Tests don't need debug symbols; dropping them slashes object/rlib disk
  # usage and link time, which is what tips the runner over on the heavy
  # runtime-benchmarks build.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  cargo-test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            extra_flags: "-- --skip test_genesis_config_builds"
          - name: runtime-benchmarks
            extra_flags: "--features runtime-benchmarks -- --skip test_genesis_config_builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: cargo-test-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ matrix.name }}-
            cargo-test-${{ runner.os }}-

      - name: Cargo test
        run: cargo test --locked ${{ matrix.extra_flags }}
