name: cargo-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SKIP_WASM_BUILD: 1
  # Tests don't need debug symbols; dropping them slashes object/rlib disk
  # usage and link time, which is what tips the runner over on the heavy
  # runtime-benchmarks build.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  cargo-test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            extra_flags: "-- --skip test_genesis_config_builds"
          - name: runtime-benchmarks
            extra_flags: "--features runtime-benchmarks -- --skip test_genesis_config_builds"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reclaim runner disk before the heavy runtime-benchmarks build, which
      # otherwise tips ubuntu-latest over on link. Toggles are explicit (rather
      # than relying on the action's defaults) and modelled on Parity's template:
      # https://github.com/paritytech/polkadot-sdk-solochain-template/blob/master/.github/actions/free-disk-space/action.yml
      # Action pinned to a release SHA instead of @main for reproducibility.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # 1.3.1
        with:
          # Big, reliable wins: preinstalled SDKs/runtimes and toolchains we
          # never touch (android ~12 GB, dotnet, haskell, docker images).
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true
          # Left off: Parity reports these as slow and occasionally flaky, and
          # the build is green without them.
          large-packages: false
          swap-storage: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: cargo-test-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ matrix.name }}-
            cargo-test-${{ runner.os }}-

      - name: Cargo test
        run: cargo test --locked ${{ matrix.extra_flags }}
