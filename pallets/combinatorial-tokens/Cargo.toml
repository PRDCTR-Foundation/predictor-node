[dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
orml-traits = { workspace = true }
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true }
prediction-market-primitives = { workspace = true }
common-primitives = { workspace = true }

# mock

cfg-if = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
orml-asset-registry = { workspace = true, optional = true }
orml-currencies = { workspace = true, optional = true }
orml-tokens = { workspace = true, optional = true }
pallet-balances = { workspace = true, optional = true }
pallet-timestamp = { workspace = true, optional = true }
sp-io = { workspace = true, optional = true }
pallet-pm-market-commons = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
test-case = { workspace = true }
pallet-pm-combinatorial-tokens = { workspace = true, features = ["default", "mock"] }

[features]
default = ["std"]
mock = [
    "cfg-if",
    "env_logger/default",
    "orml-currencies/default",
    "orml-tokens/default",
    "orml-asset-registry/default",
    "sp-io/default",
    "pallet-balances/default",
    "pallet-timestamp/default",
    "pallet-pm-market-commons/default",
    "prediction-market-primitives/mock",
]
parachain = []
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "orml-asset-registry?/runtime-benchmarks",
]
std = [
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "ark-bn254/std",
    "ark-ff/std",
    "orml-traits/std",
    "parity-scale-codec/std",
    "sp-runtime/std",
    "prediction-market-primitives/std",
    # Optional deps activated by `runtime-benchmarks` / mock.
    "orml-asset-registry?/std",
    "orml-currencies?/std",
    "orml-tokens?/std",
    "pallet-balances?/std",
    "pallet-timestamp?/std",
    "sp-io?/std",
]
try-runtime = [
    "frame-support/try-runtime",
]

[package]
authors = ["Zeitgeist PM <contact@zeitgeist.pm>"]
edition.workspace = true
name = "pallet-pm-combinatorial-tokens"
version = "0.6.1"
