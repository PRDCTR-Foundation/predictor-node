sp-runtime = { version = "39.0.5" }
sp-runtime-interface = { version = "28.0.0" }
sp-runtime-interface-proc-macro = { version = "18.0.0" }
sp-session = { version = "36.0.0" }
sp-staking = { version = "36.0.0" }
sp-state-machine = { version = "0.43.0" }
sp-std = { version = "14.0.0" }
sp-storage = { version = "21.0.0" }
