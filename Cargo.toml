[workspace.package]
license = "GPL-3.0"
authors = ["Galactic Markets Systems Team"]
homepage = "https://predictor.io/"
repository = "https://github.com/Predictor-Foundation/predictor-node"
edition = "2021"
version = "1.0.2"

[workspace]
members = [
  "node",
  "runtime",
  "macros",
  "primitives/*",
  "pallets/*",
  "pallets/combinatorial-tokens/fuzz",
  "pallets/neo-swaps/fuzz",
  "pallets/orderbook/fuzz",
  "pallets/prediction-markets/fuzz",
]
# Fuzz crates are members so they can inherit workspace deps via
# `workspace = true`, but they are excluded from the default member set so a
# bare `cargo build` does not pull in libfuzzer-sys (which only links cleanly
# under cargo-fuzz). Run them with
# `cd pallets/<x>/fuzz && cargo +nightly fuzz run <target>`.
default-members = ["node", "runtime", "macros", "primitives/*", "pallets/*"]
resolver = "2"

[workspace.dependencies]

clap = { version = "4.5.10" }
jsonrpsee = { version = "0.24.3" }
serde_json = { version = "1.0.127", default-features = false }
futures = { version = "0.3.30" }

scale-info = { version = "2.11.1", default-features = false }
parity-scale-codec = { version = "3.6.12", default-features = false, package = "parity-scale-codec" }
serde = { version = "1.0.215", default-features = false, features = [
  "derive",
  "alloc",
] }

tokio = { version = "1", default-features = false }
anyhow = { version = "1.0" }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = { version = "0.4.1", default-features = false }
log = { version = "0.4.25", default-features = false }
substrate-wasm-builder = { version = "24.0.2", default-features = false }
substrate-build-script-utils = { version = "11.0.0", default-features = false }

