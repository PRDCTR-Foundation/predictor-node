[workspace.package]
license = "GPL-3.0"
authors = ["Galactic Markets Systems Team"]
homepage = "https://predictor.io/"
repository = "https://github.com/Galactic-Media-Management/predictor-node"
edition = "2021"
version = "0.1.0"

[workspace]
members = [
    "node",
    "runtime",
    "primitives/*",
]
resolver = "2"

[workspace.dependencies]

clap = { version = "4.5.10" }
jsonrpsee = { version = "0.24.3" }
serde_json = { version = "1.0.127", default-features = false }
futures = { version = "0.3.30" }

scale-info = { version = "2.11.1", default-features = false }
parity-scale-codec = { version = "3.6.12", default-features = false, package = "parity-scale-codec" }
serde = { version = "1.0.215", default-features = false, features = ["derive", "alloc"] }
substrate-wasm-builder = { version = "24.0.2", default-features = false }
substrate-build-script-utils = { version = "11.0.0", default-features = false }

# polkadot-sdk
frame-benchmarking-cli = { version = "43.1.0", default-features = false }
frame-metadata-hash-extension = { version = "0.6.0", default-features = false }
frame-system = { version = "38.0.0", default-features = false }
pallet-transaction-payment = { version = "38.0.2", default-features = false }
pallet-transaction-payment-rpc = { version = "41.0.0", default-features = false }
sc-basic-authorship = { version = "0.45.0", default-features = false }
sc-cli = { version = "0.47.0", default-features = false }
sc-client-api = { version = "37.0.0", default-features = false }
sc-consensus = { version = "0.44.0", default-features = false }
sc-consensus-aura = { version = "0.45.0", default-features = false }
sc-consensus-grandpa = { version = "0.30.0", default-features = false }
sc-executor = { version = "0.40.1", default-features = false }
sc-network = { version = "0.45.6", default-features = false }
sc-offchain = { version = "40.0.0", default-features = false }
sc-service = { version = "0.46.0", default-features = false }
sc-telemetry = { version = "25.0.0", default-features = false }
sc-transaction-pool = { version = "37.0.0", default-features = false }
sc-transaction-pool-api = { version = "37.0.0", default-features = false }
sp-api = { version = "34.0.0", default-features = false }
sp-arithmetic = { version = "26.0.0", default-features = false }
sp-block-builder = { version = "34.0.0", default-features = false }
sp-blockchain = { version = "37.0.1", default-features = false }
sp-consensus-aura = { version = "0.40.0", default-features = false }
sp-consensus-grandpa = { version = "21.0.0", default-features = false }
sp-core = { version = "34.0.0", default-features = false }
sp-inherents = { version = "34.0.0", default-features = false }
sp-io = { version = "38.0.2", default-features = false }
sp-keyring = { version = "39.0.0", default-features = false }
sp-runtime = { version = "39.0.5", default-features = false }
sp-timestamp = { version = "34.0.0", default-features = false }
substrate-frame-rpc-system = { version = "39.0.0", default-features = false }
frame-benchmarking = { version = "38.1.1", default-features = false }
frame-executive = { version = "38.0.1", default-features = false }
frame-support = { version = "38.2.0", default-features = false }
frame-system-benchmarking = { version = "38.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "34.0.0", default-features = false }
frame-try-runtime = { version = "0.44.0", default-features = false }
pallet-aura = { version = "37.0.0", default-features = false }
pallet-balances = { version = "39.0.1", default-features = false }
pallet-grandpa = { version = "38.0.0", default-features = false }
pallet-sudo = { version = "38.0.0", default-features = false }
pallet-timestamp = { version = "37.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "38.0.0", default-features = false }
pallet-session = { version = "38.0.0", default-features = false, features = ["historical"] }
pallet-offences = { version = "37.0.0", default-features = false }
pallet-scheduler = { version = "39.1.0", default-features = false }
pallet-preimage = { version = "38.0.0", default-features = false }
sp-application-crypto = { version = "38.0.0", default-features = false }
sp-staking = { version = "36.0.0", default-features = false }
sp-genesis-builder = { version = "0.15.1", default-features = false }
sp-offchain = { version = "34.0.0", default-features = false }
sp-session = { version = "36.0.0", default-features = false }
sp-storage = { version = "21.0.0", default-features = false }
sp-transaction-pool = { version = "34.0.0", default-features = false }
sp-version = { version = "37.0.0", default-features = false }

predictor-runtime = { path = "./runtime", default-features = false }
common-primitives = { path = "./primitives/common", default-features = false }

# ORML (wasm). Pinned exactly to 1.2.1: later minors target newer polkadot-sdk
# (frame-support 41+), which conflicts with our stable2409 (38.x) stack.
orml-benchmarking = { version = "=1.2.1", default-features = false }
orml-currencies = { version = "=1.2.1", default-features = false }
orml-tokens = { version = "=1.2.1", default-features = false }
orml-traits = { version = "=1.2.1", default-features = false }
orml-xtokens = { version = "=1.2.1", default-features = false }

# AvN (tracking stable2409 branch in avn-parachain — no release tag on that SDK line)
pallet-summary = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
pallet-avn = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
pallet-authors-manager = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
pallet-eth-bridge = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
pallet-token-manager = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
sp-avn-common = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }
sp-watchtower = { git = "https://github.com/AventusProtocolFoundation/avn-parachain", branch = "feat/create-stable-2409-branch", default-features = false }

# Other (wasm)
arbitrary = { version = "1.3.2", default-features = false }
fixed = { version = "=1.15.0", default-features = false, features = ["num-traits"] }
hex-literal = { version = "0.4.1", default-features = false }
num-traits = { version = "0.2.18", default-features = false }
more-asserts = "0.3.1"
typenum = { version = "1.17.0", default-features = false }

# Other (dev-dependencies)
test-case = "3.3.1"

# HydraDX (wasm)
# hydra-dx-math = { git = "https://github.com/galacticcouncil/HydraDX-node", package = "hydra-dx-math", tag = "v43.0.0", default-features = false }

# Redirect polkadot-sdk git deps pulled in transitively by avn-parachain
# (feat/create-stable-2409-branch uses git = polkadot-sdk, branch = stable2409) to the
# crates.io releases we already use.
# Without this, the wasm runtime ends up with two copies of sp-io etc. and fails with
# duplicate lang items.
[patch."https://github.com/paritytech/polkadot-sdk"]
frame-benchmarking = { version = "38.1.1" }
frame-support = { version = "38.2.0" }
frame-support-procedural = { version = "30.0.6" }
